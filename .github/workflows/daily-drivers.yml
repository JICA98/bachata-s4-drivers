name: daily-drivers

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      branch:
        description: >-
          Mesa branch or line id to build (e.g. turnip/gen8, mojo/26.1, gen8).
          Leave empty or set to "all" to build every tracked line.
        required: false
        default: all
        type: string
      force:
        description: "Force rebuild even if SHA already released"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      lines: ${{ steps.set.outputs.lines }}
    steps:
      - uses: actions/checkout@v4

      - id: set
        run: |
          set -euo pipefail
          request="${{ github.event_name == 'workflow_dispatch' && inputs.branch || 'all' }}"
          # trim whitespace
          request="$(printf '%s' "$request" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
          if [[ -z "$request" || "$request" == "all" ]]; then
            echo 'lines=["gen8","mojo-26.1","mojo-25.0"]' >> "$GITHUB_OUTPUT"
            echo "Building all lines"
            exit 0
          fi

          # Accept line id (gen8) or git branch (turnip/gen8) from lines.conf
          line_id=""
          while IFS='=' read -r id branch; do
            [[ -z "$id" || "$id" == \#* ]] && continue
            if [[ "$request" == "$id" || "$request" == "$branch" ]]; then
              line_id="$id"
              break
            fi
          done < lines.conf

          if [[ -z "$line_id" ]]; then
            echo "Unknown branch/line: '$request'"
            echo "Valid line ids and branches from lines.conf:"
            cat lines.conf
            exit 1
          fi
          echo "lines=[\"${line_id}\"]" >> "$GITHUB_OUTPUT"
          echo "Building single line: $line_id (request=$request)"

  build:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        line: ${{ fromJson(needs.prepare.outputs.lines) }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -euo pipefail
          # Multiarch: keep default Ubuntu mirrors amd64-only; arm64 from ports.
          sudo dpkg --add-architecture arm64
          if [[ -f /etc/apt/sources.list.d/ubuntu.sources ]]; then
            sudo sed -i '/^Types: deb$/a Architectures: amd64' /etc/apt/sources.list.d/ubuntu.sources
          fi
          if [[ -f /etc/apt/sources.list ]]; then
            sudo sed -i -E 's/^deb (http|https)/deb [arch=amd64] \1/' /etc/apt/sources.list || true
          fi
          codename="$(. /etc/os-release && echo "$VERSION_CODENAME")"
          {
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename} main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename}-updates main restricted universe multiverse"
            echo "deb [arch=arm64] http://ports.ubuntu.com/ubuntu-ports ${codename}-security main restricted universe multiverse"
          } | sudo tee /etc/apt/sources.list.d/ubuntu-ports.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y \
            git meson ninja-build python3-mako python3-setuptools \
            glslang-tools flex bison pkg-config unzip file binutils \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            libz-dev:arm64 libexpat1-dev:arm64 \
            libx11-dev:arm64 libxcb1-dev:arm64 libx11-xcb-dev:arm64 \
            libxcb-dri3-dev:arm64 libxcb-present-dev:arm64 \
            libxcb-xfixes0-dev:arm64 libxcb-randr0-dev:arm64 \
            libxcb-shm0-dev:arm64 libxcb-sync-dev:arm64 \
            libxshmfence-dev:arm64

      - name: Build driver if needed
        id: build
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force && '1' || '0' }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          set +e
          out="$(./scripts/build-driver.sh "${{ matrix.line }}" 2> >(tee /tmp/build-err.txt >&2) | tee /tmp/build-out.txt | tail -n1)"
          code=$?
          set -e
          if [[ "$code" -ne 0 ]]; then
            echo "build failed with exit $code"
            echo "---- build-out (tail) ----"
            tail -n 120 /tmp/build-out.txt || true
            echo "---- build-err ----"
            cat /tmp/build-err.txt || true
            if [[ -f work/${{ matrix.line }}/build/meson-logs/meson-log.txt ]]; then
              echo "---- meson-log (tail) ----"
              tail -n 120 "work/${{ matrix.line }}/build/meson-logs/meson-log.txt" || true
            fi
            exit "$code"
          fi
          if [[ -n "$out" && -f "$out" && "$out" == *.zip ]]; then
            echo "zip=$out" >> "$GITHUB_OUTPUT"
            echo "built=true" >> "$GITHUB_OUTPUT"
            echo "asset=$(basename "$out")" >> "$GITHUB_OUTPUT"
          else
            echo "built=false" >> "$GITHUB_OUTPUT"
            echo "No new build for ${{ matrix.line }}"
          fi

      - name: Publish release
        if: steps.build.outputs.built == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          zip="${{ steps.build.outputs.zip }}"
          asset="${{ steps.build.outputs.asset }}"
          line="${{ matrix.line }}"
          rest="${asset#Turnip-}"
          rest="${rest%-EMULATOR.zip}"
          shortsha="${rest##*-}"
          without_sha="${rest%-"$shortsha"}"
          ver="${without_sha##*-v}"
          tag="${line}-v${ver}"
          commit="$(unzip -p "$zip" meta.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceCommit"])')"
          branch="$(unzip -p "$zip" meta.json | python3 -c 'import json,sys; print(json.load(sys.stdin)["sourceBranch"])')"
          title="Turnip ${line} v${ver} (${shortsha})"
          body="$(cat <<EOF
          ## Turnip ${line} v${ver}

          - Branch: \`${branch}\`
          - Commit: \`${commit}\`
          - Asset: \`${asset}\`
          - ABI: \`linux-aarch64-glibc\`

          Built automatically for BachataS4 host-glibc runtime.
          EOF
          )"
          gh release create "$tag" "$zip" \
            --title "$title" \
            --notes "$body"
